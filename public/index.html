<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOEIC Listening</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <header>
        

        <h1>TOEIC Listening</h1>
        

        <div class="toolbar">

            <input
                type="text"
                placeholder="Search..."
                id="searchBox"
            >

            <select id="level">
                <option>All Levels</option>
                <option>A1</option>
                <option>A2</option>
                <option>B1</option>
                <option>B2</option>
            </select>

            <button>
                Search
            </button>

        </div>

    </header>

    <section class="section-header">

        <h2>
            Practice Listening
            <span id="totalLessons">
                (0 Conversations)
            </span>
        </h2>

    </section>

    <div id="lessonGrid" class="lesson-grid">

    </div>

</div>

<script src="home.js"></script>

</body>

</html>
